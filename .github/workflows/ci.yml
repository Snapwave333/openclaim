name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Offline boot and CLI contract check
        timeout-minutes: 10
        shell: pwsh
        run: |
          cargo build --bin openclaim --bin openclaimd
          $env:OPENCLAIM_HOME = Join-Path $env:RUNNER_TEMP "oc-ci"
          $env:OPENCLAIM_NO_AUTOSTART = "1"
          $log = Join-Path $env:RUNNER_TEMP "openclaimd.out"
          $daemon = Start-Process -FilePath (Resolve-Path target/debug/openclaimd.exe) -ArgumentList @("--data-dir", $env:OPENCLAIM_HOME, "--no-http") -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          Start-Sleep -Seconds 3
          try {
            $status = & target/debug/openclaim.exe daemon status --output json | ConvertFrom-Json
            if (-not $status.data.reachable) { throw "daemon not reachable" }
            $schema = & target/debug/openclaim.exe schema export --file command-schema.json --output json | ConvertFrom-Json
            if (-not $schema.ok) { throw "schema export failed" }
            $mcp = & target/debug/openclaim.exe mcp test --output json | ConvertFrom-Json
            if (-not $mcp.data.ok) { throw "mcp self-test failed" }
            $states = & target/debug/openclaim.exe opportunities list --output json | ConvertFrom-Json
            if (-not $states.ok) { throw "catalog query failed" }
          } finally {
            Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 20
          }
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: No AI runtime in the build graph
        shell: pwsh
        run: |
          $tree = cargo tree --workspace --edges normal
          foreach ($bad in @("ollama", "llama", "onnx", "candle", "tch", "openai", "anthropic", "tokenizers")) {
            if ($tree -match "(?i)\b$bad\b") { throw "forbidden dependency: $bad" }
          }
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/browser-extension
      - run: npm test
        working-directory: apps/browser-extension
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
